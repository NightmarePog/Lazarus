name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Selfhost fixpoint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Rebuild compiler (fixpoint)
        run: make selfhost

      - name: Smoke test
        run: |
          cat > /tmp/Smoke.class.laz << 'LAZ'
          import std.Sys

          private msg: str

          constructor() {
              .msg = "hello" + " " + "world"
              Sys.print(.msg)
          }
          LAZ
          lua bin/lazarusc.lua /tmp/Smoke.class.laz --pkg-path .
          lua Smoke.lua | grep -q "hello world"
