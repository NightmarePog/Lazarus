name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Verify fixpoint
        run: make selfhost

      - name: Package stdlib
        run: tar -czf std.tar.gz std/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            bin/lazarusc.lua \
            std.tar.gz \
            --title "Lazarus ${{ github.ref_name }}" \
            --notes-file - << 'EOF'
          See the [changelog](https://github.com/NightmarePog/Lazarus/commits/${{ github.ref_name }}) for what changed in this release.

          ## Assets

          | File | Description |
          |---|---|
          | `lazarusc.lua` | The self-hosted compiler. Run with `lua lazarusc.lua <File.class.laz>`. |
          | `std.tar.gz` | The standard library. Extract next to your source files. |

          ## Quick start

          ```sh
          # extract the stdlib
          tar -xzf std.tar.gz

          # compile
          lua lazarusc.lua MyProgram.class.laz
          lua MyProgram.lua
          ```
          EOF
